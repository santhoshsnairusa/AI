services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=nexaware
      - POSTGRES_PASSWORD=your_secure_password
      - POSTGRES_DB=nexawaredb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/NexAware.HomeAI.Api/Dockerfile
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=nexawaredb;Username=nexaware;Password=your_secure_password
      - Ollama__BaseUrl=http://ollama:11434
    depends_on:
      - postgres
      - ollama
    restart: unless-stopped
    volumes:
      - ./Documents:/app/App_Data/Documents

  worker:
    build:
      context: .
      dockerfile: src/NexAware.HomeAI.Worker/Dockerfile
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=nexawaredb;Username=nexaware;Password=your_secure_password
      - Ollama__BaseUrl=http://ollama:11434
    depends_on:
      - postgres
      - ollama
    restart: unless-stopped
    volumes:
      - ./Documents:/app/App_Data/Documents

  web:
    build:
      context: ./src/nexaware-home-ai-web
      dockerfile: Dockerfile
    ports:
      - "8085:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data:
